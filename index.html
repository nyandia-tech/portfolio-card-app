<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Card App</title> <!--the title that appears in the browser-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" /> <!--link to the CSS file-->
</head>
<body>
  <header>
    <h1>Portfolio Card Generator</h1>
  </header>

  <main>
    <!-- Form Section (this is where the user inputs their information) -->
    <form id="userForm">
      <input type="text" id="name" placeholder="Your Name" />
      <input type="text" id="title" placeholder="Your Title" />
      <textarea id="bio" placeholder="Short Bio"></textarea>
      <input type="text" id="skills" placeholder="Skills (comma separated)" />
      <input type="url" id="linkedin" placeholder="LinkedIn URL" />
      <input type="url" id="instagram" placeholder="Instagram URL" />
      <input type="url" id="github" placeholder="GitHub URL" />
      <button type="submit">Generate Card</button>
      <button type="reset">Reset</button>
    </form>

    <!-- Card Preview Section(this is what the user sees) -->
    <section id="cardPreview" class="card-preview">
      <div class="card-content">
        <h2 id="cardName">Your Name</h2>
        <h4 id="cardTitle">Your Title</h4>
        <p id="cardBio">Short Bio</p>
        <div id="cardSkills" class="skills-tags"></div>
      </div>
      <div class="social-icons">
        <a id="cardLinkedin" href="#"><i class="fab fa-linkedin-in" aria-hidden="true"></i>LinkedIn</a>
        <a id="cardInstagram" href="#"><i class="fab fa-instagram" aria-hidden="true"></i>Instagram</a>
        <a id="cardGithub" href="#"><i class="fab fa-github" aria-hidden="true"></i>GitHub</a>
      </div>
    </section>

    <div class="theme-controls">
      <span>Theme:</span>
      <button type="button" class="theme-button" data-theme="theme-light">Light</button>
      <button type="button" class="theme-button" data-theme="theme-dark">Dark</button>
      <button type="button" class="theme-button" data-theme="theme-gradient">Gradient</button>
    </div>
  </main>

  <script src="script.js"></script><!--link to the JavaScript file-->
</body>
</html>
